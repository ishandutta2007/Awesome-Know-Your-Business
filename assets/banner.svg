<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.0"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.4"/>
    </pattern>

    <!-- Keyframe animation for dynamic subtle node pulses -->
    <style>
      .pulse-node {
        animation: pulse 4s infinite ease-in-out;
      }
      .pulse-node-delayed {
        animation: pulse 4s infinite ease-in-out 2s;
      }
      .flow-line {
        stroke-dasharray: 10 15;
        animation: dash 20s linear infinite;
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.6; }
        50% { transform: scale(1.4); opacity: 1; }
      }
      @keyframes dash {
        to { stroke-dashoffset: -100; }
      }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="360" fill="url(#bgGrad)" rx="16"/>
  <rect width="1200" height="360" fill="url(#grid)" rx="16"/>

  <!-- Background Dynamic Network Graph (Behind Text) -->
  <g stroke="#6366f1" stroke-opacity="0.25" stroke-width="1.5" class="flow-line">
    <line x1="150" y1="80" x2="300" y2="180"/>
    <line x1="300" y1="180" x2="180" y2="280"/>
    <line x1="300" y1="180" x2="450" y2="100"/>
    <line x1="1050" y1="100" x2="900" y2="200"/>
    <line x1="900" y1="200" x2="1020" y2="290"/>
    <line x1="900" y1="200" x2="750" y2="120"/>
  </g>

  <!-- Background Glowing Nodes -->
  <g fill="#818cf8">
    <circle cx="150" cy="80" r="5" class="pulse-node"/>
    <circle cx="300" cy="180" r="8" class="pulse-node-delayed"/>
    <circle cx="180" cy="280" r="6" class="pulse-node"/>
    <circle cx="450" cy="100" r="4" class="pulse-node-delayed"/>
    <circle cx="1050" cy="100" r="6" class="pulse-node"/>
    <circle cx="900" cy="200" r="8" class="pulse-node-delayed"/>
    <circle cx="1020" cy="290" r="5" class="pulse-node"/>
    <circle cx="750" cy="120" r="4" class="pulse-node"/>
  </g>

  <!-- Central Card Background (Ensures Foreground Text Readability) -->
  <rect x="180" y="55" width="840" height="250" rx="20" fill="#0f172a" fill-opacity="0.75" stroke="#334155" stroke-width="1"/>

  <!-- Top Accent Bar -->
  <rect x="180" y="55" width="840" height="6" rx="3" fill="url(#accentGrad)"/>

  <!-- Foreground Content (Title and Subtitle) -->
  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    
    <!-- Category Tag -->
    <rect x="475" y="85" width="250" height="30" rx="15" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="600" y="105" fill="#38bdf8" font-size="13" font-weight="700" letter-spacing="1.5">KNOW YOUR BUSINESS (KYB)</text>

    <!-- Main Title -->
    <text x="600" y="170" fill="#ffffff" font-size="42" font-weight="800" letter-spacing="-0.5">
      Awesome KYB Ecosystem
    </text>

    <!-- Gradient Subtitle Accent Line -->
    <text x="600" y="215" fill="url(#accentGrad)" font-size="18" font-weight="600" letter-spacing="0.5">
      Business Verification • UBO Discovery • Compliance Onboarding • Corporate Registries
    </text>

    <!-- Badges / Pill Tags inside banner -->
    <g transform="translate(410, 245)" font-size="12" font-weight="600" fill="#94a3b8">
      <rect x="0" y="0" width="110" height="26" rx="13" fill="#1e1b4b" stroke="#6366f1" stroke-opacity="0.4"/>
      <text x="55" y="17" fill="#a5b4fc">🏢 14+ SaaS</text>

      <rect x="130" y="0" width="120" height="26" rx="13" fill="#1e1b4b" stroke="#a855f7" stroke-opacity="0.4"/>
      <text x="190" y="17" fill="#c084fc">⚡ Open-Source</text>

      <rect x="260" y="0" width="120" height="26" rx="13" fill="#1e1b4b" stroke="#ec4899" stroke-opacity="0.4"/>
      <text x="320" y="17" fill="#f472b6">🌐 Global UBO</text>
    </g>
  </g>
</svg>
